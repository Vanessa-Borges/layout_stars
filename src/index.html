<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <title>B&O</title>
    <link
      rel="stylesheet"
      href="styles/style.css"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page__body">
    <header class="header">
      <div class="top-bar">
        <a href="#">
          <img
            src="images/logoB&O.png"
            alt="B&O logo"
          />
        </a>

        <div class="header__icons">
          <a
            href="#"
            class="icon icon--phone"
          ></a>

          <a
            href="#menu"
            class="icon icon--menu"
          ></a>
        </div>
      </div>

      <div class="header__bottom">
        <h1 class="header__title">
          Your senses.
          <br />
          Set free.
        </h1>
      </div>
    </header>

    <aside
      class="page__menu menu"
      id="menu"
    >
      <div class="top-bar">
        <a href="#">
          <img
            src="images/logoB&O.png"
            alt="B&O logo"
          />
        </a>

        <div class="header__icons">
          <a
            href="#"
            class="icon icon--close"
          ></a>
        </div>
      </div>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item">
            <a
              class="nav__link"
              href="#"
            >
              Home
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#recommended"
            >
              Recommended
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#categories"
            >
              Categories
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#about"
            >
              About Us
            </a>
          </li>
          <li class="nav__item">
            <a
              class="nav__link"
              href="#contacts"
            >
              Contact Us
            </a>
          </li>
        </ul>
      </nav>

      <nav class="nav__call">
        <a
          href="tel:+12345555555"
          class="menu__phone-number"
        >
          +1 234 5555-55-55
        </a>

        <a
          href="tel:+12345555555"
          class="menu__call-to-order"
        >
          Call to Order
        </a>
      </nav>
    </aside>

    <main class="main">
      <section
        class="recommended"
        id="recommended"
      >
        <h2>Recommended</h2>
      </section>

      <section
        class="categories"
        id="categories"
      >
        <h2>Sound. Vision. It’s your pick.</h2>
      </section>

      <section
        class="about"
        id="about"
      >
        <h2>Timeless, for 50 years and counting</h2>
      </section>

      <section
        class="contacts"
        id="contacts"
      >
        <h2>Contact Us</h2>
      </section>
    </main>

    <footer class="footer"></footer>
  </body>
</html>
